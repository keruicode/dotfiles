# Tmux base for macOS + WezTerm + Colemak.
# Managed by /Users/xiaoxiaotu/dotfiles/tmux.

# -----------------------------------------------------------------------------
# Terminal behavior
# -----------------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:extkeys"
set -s extended-keys on
set -s focus-events on
set -s escape-time 0
set -s repeat-time 350

set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -g history-limit 100000
set -g detach-on-destroy off

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string '#S / #W'

# -----------------------------------------------------------------------------
# Prefix and housekeeping
# -----------------------------------------------------------------------------

unbind C-b
# C-s is handled in the root table so the help popup can appear before the
# second key. tmux_which_key.py dispatches that key through the prefix table.
set -g prefix None
set -g prefix2 None
bind C-s send-keys C-s
bind -n C-s display-popup -E -x R -y P -w 58 -h 20 \
  -b rounded -s 'bg=#1e2030,fg=#f8f8f2' -S 'fg=#88e5f2,bg=#282a36' \
  -T ' TMUX · C-s ' \
  "python3 /Users/xiaoxiaotu/.config/tmux/scripts/tmux_which_key.py ui"

bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind R refresh-client -S \; display-message 'tmux client refreshed'
bind -n MouseDown1Status switch-client -t =
# Toggle the nested IAP window bar without entering the remote C-b prefix.
bind t run-shell -b '~/.config/tmux/scripts/iap_remote_status.sh toggle'

# Remove hooks and no-prefix bindings left by the previous agent-tracker config.
set-hook -gu client-attached
set-hook -gu client-detached
set-hook -gu pane-focus-in
set-hook -gu pane-died
set-hook -gu after-select-pane
set-hook -gu after-select-window
set-hook -gu session-created
set-hook -gu session-renamed
set-hook -gu session-closed
set-hook -gu window-unlinked

unbind -nq M-t
unbind -nq M-m
unbind -nq M-M
unbind -nq M-w
unbind -nq M-b
unbind -nq M-r
unbind -nq M-g
unbind -nq M-/

# Keep numbered session names contiguous: 1-project, 2-project, ...
set-hook -g session-created 'run-shell -b "python3 ~/.config/tmux/scripts/session_manager.py ensure"'
set-hook -g session-closed 'run-shell -b "python3 ~/.config/tmux/scripts/session_manager.py ensure"'
set-hook -g client-attached 'run-shell -b "~/.config/tmux/scripts/restore_once_attached.sh"'
set-hook -ag client-attached 'run-shell -b "~/.config/tmux/scripts/external_workspace.py enter \"#{session_name}\" quiet"'
set-hook -g client-session-changed 'run-shell -b "~/.config/tmux/scripts/external_workspace.py switch \"#{session_name}\""'
set-hook -g after-select-window 'run-shell -b "~/.config/tmux/scripts/external_workspace.py focus \"#{pane_id}\""'
set-hook -g after-select-pane 'run-shell -b "~/.config/tmux/scripts/external_workspace.py focus \"#{pane_id}\""'
run-shell -b 'python3 ~/.config/tmux/scripts/session_manager.py ensure'

# -----------------------------------------------------------------------------
# Session and window management
# -----------------------------------------------------------------------------

bind C-c run-shell '~/.config/tmux/scripts/new_session.sh "#{pane_current_path}" "#{client_tty}"'
bind -n M-S run-shell '~/.config/tmux/scripts/new_session.sh "#{pane_current_path}" "#{client_tty}"'
bind . command-prompt -p 'Rename session:' 'run-shell "python3 ~/.config/tmux/scripts/session_manager.py rename \"%%\" \"#{pane_id}\""'
bind , command-prompt -p 'Rename window:' 'rename-window "%%"'

bind s choose-tree -Zs
bind W choose-tree -Zw
bind -n M-s choose-tree -Zs

bind l run-shell 'python3 ~/.config/tmux/scripts/session_manager.py move left "#{pane_id}"'
bind y run-shell 'python3 ~/.config/tmux/scripts/session_manager.py move right "#{pane_id}"'

bind c new-window -c '#{pane_current_path}'
bind -n M-o new-window -c '#{pane_current_path}'
bind -n M-Q kill-pane
bind U run-shell -b '~/.config/tmux/scripts/external_workspace.py eject || true'
bind I run-shell -b '~/.config/tmux/scripts/external_workspace.py restore "#{client_tty}" || true'
bind a run-shell -b '~/.config/tmux/scripts/open_codex_dashboard.sh "#{client_tty}" "#{client_width}" "#{client_height}"'
bind -n M-a run-shell -b '~/.config/tmux/scripts/open_codex_dashboard.sh "#{client_tty}" "#{client_width}" "#{client_height}"'

bind -r C-p previous-window
bind -r C-n next-window
bind -n M-l previous-window
bind -n M-y next-window

bind 1 select-window -t :=1
bind 2 select-window -t :=2
bind 3 select-window -t :=3
bind 4 select-window -t :=4
bind 5 select-window -t :=5
bind 6 select-window -t :=6
bind 7 select-window -t :=7
bind 8 select-window -t :=8
bind 9 select-window -t :=9

bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# WezTerm and tmux negotiate extkeys, so Ctrl+digits arrive as distinct keys.
bind -n C-1 run-shell -b 'python3 ~/.config/tmux/scripts/session_manager.py switch 1 "#{client_tty}"'
bind -n C-2 run-shell -b 'python3 ~/.config/tmux/scripts/session_manager.py switch 2 "#{client_tty}"'
bind -n C-3 run-shell -b 'python3 ~/.config/tmux/scripts/session_manager.py switch 3 "#{client_tty}"'
bind -n C-4 run-shell -b 'python3 ~/.config/tmux/scripts/session_manager.py switch 4 "#{client_tty}"'
bind -n C-5 run-shell -b 'python3 ~/.config/tmux/scripts/session_manager.py switch 5 "#{client_tty}"'
bind -n C-6 run-shell -b 'python3 ~/.config/tmux/scripts/session_manager.py switch 6 "#{client_tty}"'
bind -n C-7 run-shell -b 'python3 ~/.config/tmux/scripts/session_manager.py switch 7 "#{client_tty}"'
bind -n C-8 run-shell -b 'python3 ~/.config/tmux/scripts/session_manager.py switch 8 "#{client_tty}"'
bind -n C-9 run-shell -b 'python3 ~/.config/tmux/scripts/session_manager.py switch 9 "#{client_tty}"'

# -----------------------------------------------------------------------------
# Panes: Colemak n/e/u/i = left/down/up/right
# -----------------------------------------------------------------------------

bind n split-window -hb -c '#{pane_current_path}'
bind e split-window -v -c '#{pane_current_path}'
bind u split-window -vb -c '#{pane_current_path}'
bind i split-window -h -c '#{pane_current_path}'

bind -n M-n select-pane -L
bind -n M-e select-pane -D
bind -n M-u select-pane -U
bind -n M-i select-pane -R

bind -r -n M-N resize-pane -L 3
bind -r -n M-E resize-pane -D 3
bind -r -n M-U resize-pane -U 3
bind -r -n M-I resize-pane -R 3

bind -n M-f resize-pane -Z
bind z resize-pane -Z
bind Space next-layout
bind '>' swap-pane -D
bind '<' swap-pane -U
bind q display-panes
bind x confirm-before -p 'Kill pane #P? (y/n)' kill-pane

bind C-g if-shell -F '#{pane_synchronized}' \
  'setw synchronize-panes off; display-message "pane sync: off"' \
  'setw synchronize-panes on; display-message "pane sync: ON"'

# -----------------------------------------------------------------------------
# Copy mode and clipboard
# -----------------------------------------------------------------------------

set -g mode-keys vi
set -g status-keys emacs
bind -n M-v copy-mode

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '~/.config/tmux/scripts/copy_to_clipboard.sh'
bind -T copy-mode-vi n send-keys -X cursor-left
bind -T copy-mode-vi e send-keys -X cursor-down
bind -T copy-mode-vi u send-keys -X cursor-up
bind -T copy-mode-vi i send-keys -X cursor-right
bind -T copy-mode-vi N send-keys -X start-of-line
bind -T copy-mode-vi I send-keys -X end-of-line
bind -T copy-mode-vi U send-keys -N 5 -X scroll-up
bind -T copy-mode-vi E send-keys -N 5 -X scroll-down
bind -T copy-mode-vi '=' send-keys -X search-again
bind -T copy-mode-vi '-' send-keys -X search-reverse

bind -n C-S-v run-shell -b '~/.config/tmux/scripts/paste_from_clipboard.sh'
bind -n M-V run-shell -b '~/.config/tmux/scripts/paste_from_clipboard.sh'

# -----------------------------------------------------------------------------
# Nebula status line, matched to the active WezTerm palette
# -----------------------------------------------------------------------------

set -g status on
set -g status-position bottom
set -g status-interval 30
set -g status-justify left
set -g status-style 'bg=#282a36,fg=#f8f8f2'
set -g status-left-length 72
set -g status-right-length 100
setw -g window-status-separator '#[fg=#4f5368,bg=#282a36] · '

set -g message-style 'bg=#ffd27d,fg=#282a36,bold'
set -g message-command-style 'bg=#88e5f2,fg=#282a36,bold'
setw -g mode-style 'bg=#ff7fbd,fg=#282a36,bold'

set -g pane-border-style 'fg=#59616d'
set -g pane-active-border-style 'fg=#59616d'
setw -g pane-border-lines heavy
setw -g pane-border-status top
setw -g pane-border-format '#[align=centre]#[fg=#{?pane_active,#88e5f2,#414955},bg=#282a36]#[fg=#{?pane_active,#282a36,#b6beca},bg=#{?pane_active,#88e5f2,#414955},bold] #{?window_zoomed_flag,⛶ ,}#{?#{@pane_label},#{@pane_label},#{s/^expect$/codex/:pane_current_command}} · #{b:pane_current_path} #[fg=#{?pane_active,#88e5f2,#414955},bg=#282a36,nobold]#[default]'

setw -g window-status-format '#[fg=#71798a,bg=#282a36] #W '
setw -g window-status-current-format '#[fg=#ff6b81,bg=#282a36,bold] #W '
setw -g window-status-activity-style 'fg=#ffd27d,bold'
setw -g window-status-bell-style 'fg=#ffd27d,bg=#282a36,bold'

set -g status-left '#(~/.config/tmux/tmux-status/left.sh "#{session_id}" "#{session_name}") '
set -g status-right '#(/Users/xiaoxiaotu/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{E:@dotfiles_notice}#{?@resurrect_activity,#[fg=#b294bb] #{@resurrect_activity} ,}#[fg=#88e5f2,bg=#282a36]#[fg=#282a36,bg=#88e5f2,bold] mbp '

# -----------------------------------------------------------------------------
# Persistence: survive client disconnects and restore after tmux/server restart
# -----------------------------------------------------------------------------

# Keep process restoration conservative. Codex resume commands preserve their
# thread IDs; both the legacy Expect IAP command and the remote-tmux IAP helper
# restore through the tracked reconnect script.
set -g @resurrect-processes 'lazygit yazi "~codex --yolo resume->command codex --yolo resume *" "~codex resume->command codex --yolo resume *" "~expect /opt/homebrew/bin/iap->~/.config/tmux/scripts/iap_remote_tmux.sh" "~bash /opt/homebrew/bin/iap->~/.config/tmux/scripts/iap_remote_tmux.sh" "~iap_remote_tmux.sh->~/.config/tmux/scripts/iap_remote_tmux.sh" "~tmux new-session -A -s iap->~/.config/tmux/scripts/iap_remote_tmux.sh"'
set -g @resurrect-save-command-strategy 'codex_foreground'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'full'
set -g @resurrect-delete-backup-after '90'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'P'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'off'

# Manual installation keeps TPM out of the base. Autosave is explicit in
# status-right; restore waits for a real client so detached startup cannot hang.
if-shell 'test -f ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux' \
  'run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'
if-shell 'test -f ~/.config/tmux/plugins/tmux-continuum/continuum.tmux' \
  'run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux'

# Continuum uses the verified wrapper; manual saves also keep a versioned copy
# of both the layout and the matching full pane scrollback archive.
set -g @resurrect-save-script-path '/Users/xiaoxiaotu/.config/tmux/scripts/tmux_snapshot.py'
bind S run-shell -b '~/.config/tmux/scripts/tmux_snapshot.py checkpoint manual || true'

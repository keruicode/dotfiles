# Kitty companion to the WezTerm configuration in this repository.
# macOS, Colemak navigation, tmux, Yazi, Lazygit, and LazyVim are the targets.

# Core
term xterm-kitty
shell /bin/zsh -l
include nebula.conf

# Typography: match the active WezTerm stack and scale.
font_family      postscript_name=JetBrainsMono-SemiBold
bold_font        postscript_name=JetBrainsMono-Bold
italic_font      postscript_name=JetBrainsMono-SemiBoldItalic
bold_italic_font postscript_name=JetBrainsMono-BoldItalic
font_size        26.0

symbol_map U+3000-U+303F,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF LXGW WenKai Mono Medium
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono

modify_font cell_height 105%
modify_font underline_position 2
modify_font underline_thickness 130%
disable_ligatures cursor
box_drawing_scale 0.001, 0.9, 1.4, 1.8

# macOS window
macos_option_as_alt both
macos_titlebar_color background
macos_quit_when_last_window_closed no
macos_show_window_title_in none
hide_window_decorations titlebar-only

# Keep the glass subtle. The previous 0.56 opacity made TUIs hard to read.
background_opacity 0.96
background_blur 20
dynamic_background_opacity yes

window_padding_width 8 8 6 8
window_margin_width 0
single_window_margin_width 0
placement_strategy center
remember_window_size yes
initial_window_width 1360
initial_window_height 840

# Rendering and behavior
repaint_delay 7
input_delay 1
sync_to_monitor yes
scrollback_lines 1000000
wheel_scroll_multiplier 3.0
strip_trailing_spaces smart
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.08
window_alert_on_bell yes
mouse_hide_wait 0.6
url_style curly
open_url_with default
copy_on_select no
shell_integration enabled no-cursor
allow_remote_control no

# Native Kitty text-cursor locator. It is intentionally brief so jump targets
# remain visible in tmux, LazyVim, and long terminal output without a glow.
cursor_trail 80
cursor_trail_decay 0.12 0.28
cursor_trail_start_threshold 2
cursor_trail_color #88e5f2

# Do not leak the parent tmux/no-color state when Kitty is launched from a shell.
env TMUX
env TMUX_PANE
env NO_COLOR
env TERM_PROGRAM=kitty
env COLORTERM=truecolor
env CLICOLOR=1

# Tabs: the same compact top-bar intent as WezTerm.
tab_bar_min_tabs 2
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_align center
tab_bar_margin_width 8
tab_bar_margin_height 6 4
tab_bar_show_new_tab_button yes
tab_switch_strategy previous
tab_title_max_length 28
tab_activity_symbol " 󰎔"
tab_title_template "{custom}"
active_tab_title_template "{fmt.bold}{custom}{fmt.nobold}"
active_tab_font_style bold
inactive_tab_font_style normal

# Windows and splits
enabled_layouts splits,tall,stack,fat,grid
window_border_width 2px
draw_minimal_borders yes
inactive_text_alpha 1.0

# macOS basics
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+h hide_macos_app
map cmd+f toggle_fullscreen
map cmd+l send_text all \x0c
map cmd+r send_text all \x12
map cmd+comma open_kitty_config

# Shell line editing
map cmd+a send_text all \x01
map cmd+e send_text all \x05
map cmd+backspace send_text all \x15

# Font size
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0

# Tabs
map cmd+t new_tab_with_cwd
map cmd+shift+t new_tab_with_cwd
map cmd+shift+d close_tab
map cmd+n previous_tab
map cmd+i next_tab
map cmd+left previous_tab
map cmd+right next_tab
map cmd+shift+left move_tab_backward
map cmd+shift+right move_tab_forward
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# OS windows and panes. u/e/n/i follow the Colemak layout.
map cmd+enter launch --type=os-window --cwd=current
map cmd+w close_window
map cmd+backslash launch --location=hsplit --cwd=current
map cmd+shift+backslash launch --location=vsplit --cwd=current
map cmd+shift+u neighboring_window up
map cmd+shift+e neighboring_window down
map cmd+shift+n neighboring_window left
map cmd+shift+i neighboring_window right
map cmd+alt+u resize_window taller 3
map cmd+alt+e resize_window shorter 3
map cmd+alt+n resize_window narrower 3
map cmd+alt+i resize_window wider 3
map cmd+shift+z toggle_layout stack
map cmd+shift+o next_layout

# TUI launchers
map cmd+shift+y launch --type=tab --cwd=current yazi
map f1 show_scrollback
map f2 kitten command-palette
map f3 launch --type=overlay --cwd=current yazi
map cmd+shift+f search_scrollback
map cmd+u kitten hints --type url --program open
map cmd+p kitten hints --type path --program open

# Match WezTerm's Cmd-click URL behavior.
mouse_map cmd+left release grabbed,ungrabbed open_url
